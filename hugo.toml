baseURL = 'https://prakash-khadka.com.np/'
languageCode = 'en-us'
title = 'Prakash Khadka'
theme = 'typo'

# Google analytics code
googleAnalytics = "G-YB32WM67KX"

[taxonomies]
tag = 'tags'

[params]
faviconPath = "favicon"

# Meta description
description = "Prakash Khadka is a Site Reliability Engineer working with Google Cloud, Kubernetes, infrastructure as code and cloud security."

# Appearance settings
theme = 'auto'
colorPalette = 'base16-eighties'
hideHeader = false

# Collection to display on home
#homeCollectionTitle = 'Posts'
#homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'

# Footer
showFooter = true
footerContent = "Prakash Khadka — Built with curiosity, coffee, and Kubernetes."

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/pkhadka56/"

[[params.social]]
name = "github"
url = "https://github.com/pkhadka56"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "skills"
url = "/skills"

[[params.menu]]
name = "certs"
url = "/certs"

[[params.menu]]
name = "books"
url = "/books"

# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'algol'

# Giscus comments
[params.giscus]
enable = false
repo = "user/repo"
repoid = "repoId"
category = "General"
categoryid = "categoryId"
mapping = "pathname"
theme = "preferred_color_scheme"
